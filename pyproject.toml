[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proofage"
dynamic = ["version"]
description = "Python client for the ProofAge age and identity verification API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ProofAge", email = "support@proofage.xyz" }]
keywords = ["age verification", "identity verification", "kyc", "proofage", "webhooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.urls]
Homepage = "https://proofage.xyz"
Repository = "https://github.com/ProofAge/python-sdk"
Changelog = "https://github.com/ProofAge/python-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "packaging>=24",
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/proofage/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proofage"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "proofage/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = ["src/proofage", "tests", "AGENTS.md", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
